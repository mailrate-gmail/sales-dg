services:
  server:
    build: ./server
    container_name: ai-meeting-assistant-server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env

  client:
    build: ./client
    container_name: ai-meeting-assistant-client
    ports:
      - "3000:3000"
    depends_on:
      - server
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
